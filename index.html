<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard MEP</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: 'Inter', "Segoe UI", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .container {
      padding: 40px 20px;
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .category-section {
      margin-bottom: 40px;
    }

    .category-section h2 {
      font-size: 20px;
      color: var(--text-main);
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .card h3 {
      margin: 0 0 10px 0;
      color: var(--text-main);
      font-size: 18px;
    }

    .card p {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 20px 0;
      flex: 1;
      line-height: 1.5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent);
      color: #fff;
    }

    footer {
      background: var(--bg-card);
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
      font-size: 14px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <h1>⚙️ Dashboard APPs MEP</h1>
</header>

<div class="container" id="app-container">
  <!-- El contenido se generará dinámicamente con JavaScript -->
</div>

<footer>
  <p>⚙️ Apps MEP | <span id="version"></span></p>
  <p>Desarrollado por rpulido_ELECNOR SA · © 2026</p>
</footer>

<script>
  // ==========================================
  // 🛠️ CONFIGURACIÓN DE ENLACES (DATA)
  // Añade o modifica los enlaces a tus repositorios aquí
  // ==========================================
  const appsData = [
    {
      title: "Hidráulica",
      icon: "🔵",
      apps: [
        { name: "HS5 PB SAN", desc: "Pozo Bombeo Fecales saneamiento_HS4", url: "APP_1.Calc.PB_SAN/" },
        { name: "HS1 PB NF", desc: "Pozo Bombeo Nivel Freático_HS1", url: "APP_2.Calc.PB_NF/" },
        { name: "HID Bombas Múltiples", desc: "Cálculos hidráulicos Curvas Bombas", url: "APP_3.Calc_B.HID_Multiples/" },
        { name: "Caudales Agua AA", desc: "Cálculo de caudales de agua climatización", url: "APP_4.Calc.Caudales-AA/" },
        { name: "Piscina Full", desc: "Herramienta completa Filtración", url: "APP_5.1.Calc.HID_Piscina_Full/" },
        { name: "Piscinas", desc: "Cálculo básico Filtración", url: "APP_5.Calc.HID_Piscinas/" },
        { name: "Deshumectadora", desc: "Cálculo básico caudal a deshumectar", url: "APP_7.Calc.DESH_Piscina/" }
      ]
    },
    {
      title: "BT, Protección y Puesta a Tierra",
      icon: "⚡",
      apps: [
        { name: "Fotovoltáica", desc: "Cálculo Fotovoltáico: Condiciones de trabajo y Seguridad", url: "APP_12.Calc.FV_Fotovoltaica/" },
        { name: "SUA8 Pararrayos", desc: "Cálculo SUA8: Necesidad Pararrayos", url: "APP_6.Calc.SUA8_Pararrayos/" },
        { name: "Anillo Puesta a Tierra", desc: "Cálculo Puesta a Tierra_Anillos y Picas", url: "APP_8.Calc.Puesta_a_Tierra/" },
        { name: "Batería condensadores", desc: "Cálculo compensación Energía Reactiva", url: "APP_9.Calc.BT.Bateria_Condensadores/" }
      ]
    },
    {
      title: "Protección Contra Incendios",
      icon: "🔥",
      apps: [
        { name: "UNE 12845: SPK", desc: "Cálculo SPK: Condiciones mínima Rociadores", url: "APP_10.Cal.PCI.SPK_Rociadores/" }
      ]
    },
    {
      title: "Climatización y Ventilación",
      icon: "❄️",
      apps: [
        { name: "Climatización", desc: "Caudales Agua Refrigerada", url: "APP_11.Calc.AA_Caudales_Agua/" }
      ]
    }
  ];

  // ==========================================
  // 🚀 RENDERIZADO AUTOMÁTICO
  // No necesitas tocar esto para añadir nuevos enlaces
  // ==========================================
  const container = document.getElementById('app-container');

  appsData.forEach(category => {
    const section = document.createElement('div');
    section.className = 'category-section';
    
    const title = document.createElement('h2');
    title.innerHTML = `${category.icon} ${category.title}`;
    section.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';

    category.apps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${app.name}</h3>
        <p>${app.desc}</p>
        <a href="${app.url}" class="btn">Abrir Aplicación ➔</a>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });

  // Autogeneración de versión y fecha
  const fecha = new Date();
  const version = "v" + fecha.getFullYear() + "." + (fecha.getMonth()+1) + "." + fecha.getDate();
  document.getElementById("version").innerText = "Versión " + version;
</script>

</body>
</html>
